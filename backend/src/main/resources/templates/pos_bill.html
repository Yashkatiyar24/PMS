<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${order.billNumber} ?: 'Bill'">Bill</title>
  <style>
    /* Sized for a thermal roll; prints fine on A4 too. */
    body { font-family: "Noto Sans", "DejaVu Sans", sans-serif; font-size: 9pt; color: #111; margin: 0 auto; max-width: 80mm; padding: 3mm; }
    h1 { font-size: 1.2em; margin: 0; text-align: center; }
    .muted { color: #555; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    th, td { padding: 2px; text-align: left; }
    thead th { border-bottom: 1px solid #000; }
    .num { text-align: right; white-space: nowrap; }
    .grand td { border-top: 1px solid #000; font-weight: bold; }
    .kind { text-align: center; font-weight: bold; margin: 6px 0; text-transform: uppercase; }
    @media print { body { padding: 0; } }
  </style>
</head>
<body>
  <h1 th:text="${property.name}">Property</h1>
  <div class="muted" th:text="${property['address']} + ' ' + ${property['city']}">Address</div>
  <div class="muted" th:if="${property['gstin']}" th:text="'GSTIN: ' + ${property['gstin']}">GSTIN</div>
  <div class="kind" th:text="${order.status == 'paid'} ? 'Bill ' + ${order.billNumber} : (${order.status == 'posted'} ? 'Charged to room ' + ${order.units} : 'Order')">Bill</div>
  <div class="muted" th:text="${when} + (${order.tableLabel} ? ' · ' + ${order.tableLabel} : '')">date</div>
  <table>
    <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
    <tbody>
      <tr th:each="l : ${lines}">
        <td th:text="${l.name}">Thali</td><td class="num" th:text="${l.qty}">1</td>
        <td class="num" th:text="${l.rate}">120</td><td class="num" th:text="${l.amount}">120</td>
      </tr>
    </tbody>
  </table>
  <table>
    <tr><td>Taxable</td><td class="num" th:text="${taxable}">0</td></tr>
    <tr th:if="${order.taxRateBp > 0}"><td th:text="'CGST @ ' + ${order.taxRateBp / 200.0} + '%'">CGST</td><td class="num" th:text="${cgst}">0</td></tr>
    <tr th:if="${order.taxRateBp > 0}"><td th:text="'SGST @ ' + ${order.taxRateBp / 200.0} + '%'">SGST</td><td class="num" th:text="${sgst}">0</td></tr>
    <tr class="grand"><td>Total</td><td class="num" th:text="${total}">0</td></tr>
  </table>
  <div class="muted" th:if="${footer}" th:text="${footer}">Thank you</div>
</body>
</html>
